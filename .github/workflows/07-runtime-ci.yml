name: 07 Runtime CI

on:
  push:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/**"
      - ".github/workflows/07-runtime-ci.yml"
  pull_request:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/**"
      - ".github/workflows/07-runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 00_runtime-and-deployment/01_simple-multi-llm-compose
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend tests (Fake Client)
        run: pytest backend/test_app.py -q

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build
